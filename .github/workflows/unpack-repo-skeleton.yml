name: Unpack repository skeleton

on:
  workflow_dispatch:
  push:
    paths:
      - 'imports/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify import marker
        run: |
          set -euo pipefail
          test -f imports/READY

      - name: Assemble, decode and unpack skeleton
        run: |
          set -euo pipefail
          mkdir -p /tmp/ea-import/unpacked

          python - <<'PY'
          import base64
          import glob
          import pathlib
          import re
          import sys

          imports = pathlib.Path('imports')
          work = pathlib.Path('/tmp/ea-import')
          work.mkdir(parents=True, exist_ok=True)

          tar_parts = sorted(glob.glob('imports/m365-executive-assistant-repo-skeleton.tar.xz.b64.part-*'))
          zip_parts = sorted(glob.glob('imports/m365-executive-assistant-repo-skeleton.zip.b64.part-*'))

          if tar_parts:
              target = work / 'skeleton.tar.xz'
              parts = tar_parts
              mode = 'tar.xz'
          elif (imports / 'm365-executive-assistant-repo-skeleton.tar.xz.b64').exists():
              target = work / 'skeleton.tar.xz'
              parts = [str(imports / 'm365-executive-assistant-repo-skeleton.tar.xz.b64')]
              mode = 'tar.xz'
          elif zip_parts:
              target = work / 'skeleton.zip'
              parts = zip_parts
              mode = 'zip'
          elif (imports / 'm365-executive-assistant-repo-skeleton.zip.b64').exists():
              target = work / 'skeleton.zip'
              parts = [str(imports / 'm365-executive-assistant-repo-skeleton.zip.b64')]
              mode = 'zip'
          else:
              raise SystemExit('No import payload found.')

          print(f'Import mode: {mode}')
          print(f'Part count: {len(parts)}')

          allowed = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n\t ')
          chunks = []
          for part in parts:
              data = pathlib.Path(part).read_bytes()
              invalid = sorted(set(data) - allowed)
              print(f'{part}: {len(data)} bytes')
              if invalid:
                  print(f'Invalid bytes in {part}: {invalid}', file=sys.stderr)
                  raise SystemExit(2)
              chunks.append(data)

          raw = b''.join(chunks)
          compact = re.sub(rb'\s+', b'', raw)
          print(f'Base64 bytes after whitespace removal: {len(compact)}')
          print(f'Base64 length mod 4: {len(compact) % 4}')

          try:
              decoded = base64.b64decode(compact, validate=True)
          except Exception as exc:
              print(f'Base64 decode failed: {exc}', file=sys.stderr)
              raise SystemExit(3)

          target.write_bytes(decoded)
          print(f'Wrote {target}: {len(decoded)} bytes')
          PY

          if test -f /tmp/ea-import/skeleton.tar.xz; then
            tar -xJf /tmp/ea-import/skeleton.tar.xz -C /tmp/ea-import/unpacked
          else
            unzip -q -o /tmp/ea-import/skeleton.zip -d /tmp/ea-import/unpacked
          fi

          test -d /tmp/ea-import/unpacked/m365-executive-assistant
          cp -R /tmp/ea-import/unpacked/m365-executive-assistant/. .

      - name: Move workflow templates out of restricted directory
        run: |
          set -euo pipefail
          mkdir -p docs/workflows
          if test -f .github/workflows/ci.yml; then
            mv .github/workflows/ci.yml docs/workflows/ci.yml.template
          fi
          if test -f .github/workflows/evals.yml; then
            mv .github/workflows/evals.yml docs/workflows/evals.yml.template
          fi
          if test -f .github/workflows/security-scan.yml; then
            mv .github/workflows/security-scan.yml docs/workflows/security-scan.yml.template
          fi

      - name: Remove import payload after successful extraction
        run: |
          rm -f imports/READY
          rm -f imports/m365-executive-assistant-repo-skeleton.zip.b64
          rm -f imports/m365-executive-assistant-repo-skeleton.zip.b64.part-*
          rm -f imports/m365-executive-assistant-repo-skeleton.tar.xz.b64
          rm -f imports/m365-executive-assistant-repo-skeleton.tar.xz.b64.part-*
          rmdir imports 2>/dev/null || true

      - name: Commit unpacked skeleton
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unpack M365 Executive Assistant repository skeleton"
            git push
          fi
