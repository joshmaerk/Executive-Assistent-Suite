name: Unpack repository skeleton

on:
  workflow_dispatch:
  push:
    paths:
      - 'imports/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify import marker
        run: |
          set -euo pipefail
          test -f imports/READY

      - name: Assemble, decode and unpack skeleton
        run: |
          set -euo pipefail
          mkdir -p /tmp/ea-import/unpacked

          if compgen -G "imports/m365-executive-assistant-repo-skeleton.tar.xz.b64.part-*" > /dev/null; then
            cat imports/m365-executive-assistant-repo-skeleton.tar.xz.b64.part-* > /tmp/ea-import/skeleton.tar.xz.b64
            base64 -d /tmp/ea-import/skeleton.tar.xz.b64 > /tmp/ea-import/skeleton.tar.xz
            tar -xJf /tmp/ea-import/skeleton.tar.xz -C /tmp/ea-import/unpacked
          elif test -f imports/m365-executive-assistant-repo-skeleton.tar.xz.b64; then
            base64 -d imports/m365-executive-assistant-repo-skeleton.tar.xz.b64 > /tmp/ea-import/skeleton.tar.xz
            tar -xJf /tmp/ea-import/skeleton.tar.xz -C /tmp/ea-import/unpacked
          elif compgen -G "imports/m365-executive-assistant-repo-skeleton.zip.b64.part-*" > /dev/null; then
            cat imports/m365-executive-assistant-repo-skeleton.zip.b64.part-* > /tmp/ea-import/skeleton.zip.b64
            base64 -d /tmp/ea-import/skeleton.zip.b64 > /tmp/ea-import/skeleton.zip
            unzip -q -o /tmp/ea-import/skeleton.zip -d /tmp/ea-import/unpacked
          else
            test -f imports/m365-executive-assistant-repo-skeleton.zip.b64
            base64 -d imports/m365-executive-assistant-repo-skeleton.zip.b64 > /tmp/ea-import/skeleton.zip
            unzip -q -o /tmp/ea-import/skeleton.zip -d /tmp/ea-import/unpacked
          fi

          test -d /tmp/ea-import/unpacked/m365-executive-assistant
          cp -R /tmp/ea-import/unpacked/m365-executive-assistant/. .

      - name: Remove import payload after successful extraction
        run: |
          rm -f imports/READY
          rm -f imports/m365-executive-assistant-repo-skeleton.zip.b64
          rm -f imports/m365-executive-assistant-repo-skeleton.zip.b64.part-*
          rm -f imports/m365-executive-assistant-repo-skeleton.tar.xz.b64
          rm -f imports/m365-executive-assistant-repo-skeleton.tar.xz.b64.part-*
          rmdir imports 2>/dev/null || true

      - name: Commit unpacked skeleton
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unpack M365 Executive Assistant repository skeleton"
            git push
          fi
