name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Validate schemas
        run: python scripts/validate_schemas.py

      - name: Test
        run: pytest

      # TODO: continue-on-error entfernen, sobald `mypy src` dauerhaft grün ist
      # (siehe specs/agent-governance/02-implementation-roadmap.md, P0).
      - name: Typecheck
        run: mypy src
        continue-on-error: true
