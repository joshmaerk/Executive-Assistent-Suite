name: agent-pr-fix

# Verbesserungs-Loop: reagiert auf fehlgeschlagene CI oder Review-Kommentare
# auf agent/*-Pull-Requests und bessert nach.
# Logik: specs/agent-governance/03-autonomous-agent-workflow.md (Rolle iterate).

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

concurrency:
  group: agent-pr-fix-${{ github.event.workflow_run.id || github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  iterate:
    # Nur reagieren, wenn ein agent/*-PR betroffen ist:
    #  - workflow_run: CI fehlgeschlagen auf einem agent/*-Branch
    #  - pull_request_review: Review mit angefragten Aenderungen
    #  - issue_comment: Kommentar auf einem Pull Request
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       startsWith(github.event.workflow_run.head_branch, 'agent/')) ||
      (github.event_name == 'pull_request_review' &&
       startsWith(github.event.pull_request.head.ref, 'agent/')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # TODO: use_foundry / ANTHROPIC_FOUNDRY_BASE_URL und --model gegen die
      # gepinnte Version von anthropics/claude-code-action verifizieren.
      - name: Run autonomous iterate loop
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_FOUNDRY_BASE_URL: ${{ vars.ANTHROPIC_FOUNDRY_BASE_URL }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_foundry: "true"
          claude_args: "--model claude-sonnet-4-5 --max-turns 30"
          prompt: >-
            Du bist der autonome AI-Coding-Task-Runner dieses Repos.
            Folge exakt der Datei specs/agent-governance/03-autonomous-agent-workflow.md,
            Rolle "iterate". Diagnostiziere den ausloesenden CI-Fehler oder
            Review-Kommentar auf dem betroffenen agent/*-Pull-Request, pushe einen
            minimalen Fix auf denselben Branch und merge nichts.
