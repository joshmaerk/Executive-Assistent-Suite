[project]
name = "m365-executive-assistant"
version = "0.1.0"
description = "Controlled Microsoft 365 Executive Assistant with Power Automate, Azure OpenAI and Foundry."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "openai>=1.42",
    "httpx>=0.27",
    "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
